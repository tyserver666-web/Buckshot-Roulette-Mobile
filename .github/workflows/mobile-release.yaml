name: Release Godot (Android)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name"
        required: true
      release_tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
      release_description:
        description: "Release description / changelog"
        required: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
      EXPORT_PRESET_ANDROID: "Android"
      EXPORT_DIR_ANDROID: "build/android"
      APK_NAME: "Buckshot-Android-${{ github.sha }}.apk"

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot (headless) and templates
        run: |
          set -euxo pipefail
          mkdir -p tools/godot
          cd tools/godot
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 Godot
          chmod +x Godot
          cd -
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${TEMPLATES_DIR}"
          curl -L -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d templates_unpacked
          cp -R templates_unpacked/templates/* "${TEMPLATES_DIR}/"

      - name: Export Android APK
        run: |
          set -euxo pipefail
          mkdir -p "${EXPORT_DIR_ANDROID}"
          tools/godot/Godot --headless --path . --export-release "${EXPORT_PRESET_ANDROID}" "${EXPORT_DIR_ANDROID}/${APK_NAME}"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.EXPORT_DIR_ANDROID }}/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          body: ${{ github.event.inputs.release_description }}
          draft: false
          prerelease: false
          files: |
            ${{ env.EXPORT_DIR_ANDROID }}/${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
